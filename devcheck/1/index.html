  // 与 indep_check.probe_page 里取笔起点的那一段相同
  const BOX_JS = "id => { const d = window.__nipcNotes.placed(id); if (!d || !d.abs) return null; const f = window.__nipcNotes.frame();" +
                 " return [f.x + d.abs[0][0] * f.s + scrollX, f.y + d.abs[0][1] * f.s + scrollY]; }";
  const REPO = 'delluluwxy/neural-ipc-notes', SYNC_KEY = 'nipc-notes-sync';
  const qs = new URLSearchParams(location.search);
  const NO_UPLOAD = qs.get('noupload') === '1';
  const FIXED_WAITS = qs.get('waits') === 'fixed';   // A/B 用：服务器 indep_check 的固定等待（1.5 s、0.8 s、每笔 30 + 100·重试 ms）；默认等布局稳定
  const NO_CACHE = qs.get('nocache') === '1';        // 不用已上传的基准页采样，重测
  // 默认 layout：每页只导出一遍布局表（几秒），服务器纯几何重算；probe：在设备上逐笔原样跑 PROBE_JS（慢，一页约 10 分钟，A/B 对拍用），同时也导出布局表
  const MODE = qs.get('mode') === 'probe' ? 'probe' : 'layout';
  const EVERY = Math.max(1, parseInt(qs.get('every') || '1', 10) || 1);   // probe 模式每 N 笔跑一笔（调试几何对拍用）

  /** 结果只许写 checks/ 下的一个文件：不许 notes/、covers/、子目录、..。 */
  const checkPath = p => {
    if (typeof p !== 'string' || !p.startsWith('checks/') || p.includes('..') || p.slice(7).includes('/') ||
        /^(notes|covers)\//.test(p) || !/^checks\/devcheck_[A-Za-z0-9_]+_\d{8}T\d{6}Z\.json$/.test(p))
      throw new Error('结果路径必须是 checks/devcheck_<页>_<时间>.json：' + p);
    return p;
  };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const $ = s => document.querySelector(s);
  const say = msg => { $('#dc-status').textContent = msg; };
  const warns = [];
  const warn = msg => { warns.push(msg); $('#dc-warn').textContent = '注意：' + warns.join('；'); };
  const fmtTime = s => s >= 90 ? `${Math.round(s / 60)} 分钟` : `${Math.max(1, Math.round(s))} 秒`;

  function targetsFromQuery() {
    const raw = (qs.get('page') || CFG.default_targets.join(',')).split(',').map(s => s.trim()).filter(Boolean);
    for (const p of raw) if (!CFG.targets.includes(p)) throw new Error('不认识的待测页：' + p + '（只认 ' + CFG.targets.join(' / ') + '）');
    return [...new Set(raw)];
  }
  async function waitFor(fn, ms) {
    const t0 = Date.now();
    for (;;) { try { const v = fn(); if (v) return v; } catch (e) { /* 还没就绪 */ }
      if (Date.now() - t0 > ms) throw new Error('等待超时'); await sleep(100); }
  }

  // ---- 设备 / 视口记录 ----
  const W = innerWidth, H = innerHeight;
  let resizes = 0;
  addEventListener('resize', () => { resizes++; });
  const stage = $('#dc-stage');
  stage.style.width = W + 'px'; stage.style.height = H + 'px';

  /** 在 iframe 里打开一页，照 open_served + probe_page 的顺序准备好。返回 {ifr, win}。 */
  async function openPage(page) {
    stage.innerHTML = '';
    const ifr = document.createElement('iframe');
    ifr.width = W; ifr.height = H;
    ifr.style.width = W + 'px'; ifr.style.height = H + 'px';
    ifr.setAttribute('scrolling', 'yes');
    const loaded = new Promise(r => { ifr.addEventListener('load', r, { once: true }); });
    ifr.src = `../../${page}/week3_4.html`;
    stage.appendChild(ifr);
    await loaded;
    const win = ifr.contentWindow;
    await waitFor(() => win.__nipcNotes && win.MathJax && win.MathJax.startup && win.MathJax.startup.promise, 120000);
    await win.MathJax.startup.promise;
    await Promise.all([...win.document.images].map(i => (i.loading = 'eager', i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))));
    win.document.querySelectorAll('details').forEach(d => { d.open = true; });
    if (FIXED_WAITS) await sleep(1500); else await settle(win);
    const st = win.document.createElement('style');
    st.textContent = '#annot-layer, #annot-capture { pointer-events: none !important; }';
    win.document.head.appendChild(st);
    if (FIXED_WAITS) await sleep(800); else await settle(win);
    return { ifr, win };
  }
  /** iframe 里两帧 requestAnimationFrame（标注层的重排在 rAF 里做，见 annotate.py scheduleRender）。 */
  const frames2 = win => new Promise(r => win.requestAnimationFrame(() => win.requestAnimationFrame(r)));
  /** 等到布局稳定：字体就绪后，连续两次「两帧之后」文档高度、正文宽、标注层重排计数都不变。 */
  async function settle(win) {
    if (win.document.fonts && win.document.fonts.ready) await win.document.fonts.ready;
    const sig = () => JSON.stringify([win.document.documentElement.scrollHeight, win.document.querySelector('main article').getBoundingClientRect().width,
                                      win.__nipcNotes.frame()]);
    let prev = null;
    for (let k = 0; k < 200; k++) { await frames2(win); const s = sig(); if (s === prev) return; prev = s; }
    throw new Error('布局 200 次两帧后仍在变');
  }
  function scrollInstant(win, y) {
    try { win.scrollTo({ top: y, behavior: 'instant' }); }
    catch (e) { win.document.documentElement.style.scrollBehavior = 'auto'; win.scrollTo(0, y); }
  }

  /** 一页逐笔采样（同 indep_check.probe_page）。onStroke(已做笔数) 更新进度。 */
  async function probePage(page, withDump, onStroke) {
    const tLoad = performance.now();
    const { ifr, win } = await openPage(page);
    const tProbe = performance.now();
    let iresize = 0;
    win.addEventListener('resize', () => { iresize++; });
    const fn = src => win.eval('(' + src + ')');
    const probe = fn(SRC.probe), box = fn(BOX_JS);
    const env_start = fn(SRC.env)();
    const ids = win.__nipcNotes.strokes().map(s => s.id);
    const out = {}, scrolls = {};
    if (MODE === 'probe') {
      for (const i of (EVERY > 1 ? ids.filter((_, k) => k % EVERY === 0) : ids)) {
        const b = box(i);
        if (b) {
          for (let attempt = 0; attempt < 3; attempt++) {
            scrollInstant(win, Math.max(0, b[1] - win.innerHeight / 2));
            if (FIXED_WAITS) await sleep(30 + 100 * attempt); else for (let a = 0; a <= attempt; a++) await frames2(win);
            scrolls[i] = [win.scrollX, win.scrollY];
            out[i] = probe([i, CFG.grid, CFG.sample, CFG.budget, 0, 0]);
            if (out[i].state !== 'offscreen') break;
          }
        } else out[i] = probe([i, CFG.grid, CFG.sample, CFG.budget, 0, 0]);
        onStroke(Object.keys(out).length, ids.length);
      }
    }
    const msProbe = performance.now() - tProbe;
    const tLay = performance.now();
    const layout = fn(SRC.layout)();
    const msLayout = performance.now() - tLay;
    if (MODE !== 'probe') onStroke(ids.length, ids.length);
    const texts = fn(SRC.texts)();
    const env_end = fn(SRC.env)();
    let tex = [];
    try { tex = [...win.MathJax.startup.document.math].map(m => m.math); } catch (e) { /* 留空 */ }
    const run = { page, ids, mode: MODE, layout, texts: JSON.parse(JSON.stringify(texts)),
                  tex, env_start, env_end, iframe_resizes: iresize, iframe_attr: [ifr.offsetWidth, ifr.offsetHeight],
                  waits: FIXED_WAITS ? 'fixed' : 'settle' };
    if (MODE === 'probe') { run.probes = JSON.parse(JSON.stringify(out)); run.scrolls = scrolls; }
    if (withDump) run.dump = JSON.parse(JSON.stringify(fn(SRC.dump)()));
    run.ms_layout = Math.round(msLayout);
    run.ms = { load: Math.round(tProbe - tLoad), probe: Math.round(msProbe), total: Math.round(performance.now() - tLoad) };
    return JSON.parse(JSON.stringify(run));
  }

  /** iframe 排版是否等于直接打开：iframe 视口 = 设定尺寸 = 顶层视口，运行中视口没变，没被撑高，text-size-adjust 为 100%。 */
  function envProblems(run) {
    const p = [], e = run.env_start, f = run.env_end;
    if (e.inner[0] !== W || e.inner[1] !== H) p.push(`${run.page} 的 iframe 视口 ${e.inner.join('×')} ≠ 设备视口 ${W}×${H}`);
    if (e.inner[1] > H + 1 || run.iframe_attr[1] > H + 1) p.push(`${run.page} 的 iframe 被撑高（${run.iframe_attr[1]} px）`);
    for (const k of ['inner', 'client', 'zoom', 'art_w', 'p_font', 'p_lh', 'root_font'])
      if (JSON.stringify(e[k]) !== JSON.stringify(f[k])) p.push(`${run.page} 运行中 ${k} 变了：${JSON.stringify(e[k])} → ${JSON.stringify(f[k])}`);
    if (e.tsa && !/^(100%|none)$/.test(String(e.tsa))) p.push(`${run.page} 的 text-size-adjust = ${e.tsa}（不是 100%）`);
    if (run.iframe_resizes) p.push(`${run.page} 的 iframe 运行中尺寸变了 ${run.iframe_resizes} 次`);
    return p;
  }

  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  function b64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  // 与标注层同步、covers 页同一读法
  function token() { try { return (JSON.parse(localStorage.getItem(SYNC_KEY) || '{}') || {}).token || ''; } catch (e) { return ''; } }
  /** 只写 checkPath(path) 这一个文件：GET 取 sha（404 = 新建），PUT；sha 冲突重拉一次。返回提交 sha。 */
  async function upload(path, text, tok, msg) {
    const url = `https://api.github.com/repos/${REPO}/contents/${checkPath(path)}`;
    const hdr = { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    for (let attempt = 0; attempt < 2; attempt++) {
      const g = await fetch(url, { method: 'GET', headers: hdr, cache: 'no-store' });
      if (!g.ok && g.status !== 404) throw new Error('读取 ' + g.status);
      const sha = g.ok ? (await g.json()).sha : null;
      const body = { message: msg, content: b64(text) };
      if (sha) body.sha = sha;
      const p = await fetch(url, { method: 'PUT', headers: hdr, body: JSON.stringify(body) });
      if (p.status === 409 || p.status === 422) continue;
      if (!p.ok) throw new Error('写入 ' + p.status);
      const j = await p.json();
      return (j.commit && j.commit.sha) || (j.content && j.content.sha) || 'ok';
    }
    throw new Error('sha 冲突两次');
  }
  function offerDownload(path, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = checkPath(path).split('/').pop();
    a.textContent = '下载结果 ' + a.download;
    $('#dc-done').appendChild(a);
  }
  const doneLine = msg => { const d = document.createElement('div'); d.textContent = msg; $('#dc-done').appendChild(d); };

  const ghHdr = (tok, accept) => ({ Authorization: 'Bearer ' + tok, Accept: accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' });
  /** 这台设备 + 这版基准页 + 这版采样代码的签名：签名相同，基准页的采样结果就相同，可以复用。 */
  async function deviceSig() {
    const html = await (await fetch(`../../${CFG.base}/week3_4.html`, { cache: 'no-store' })).text();
    const sig = { ua: navigator.userAgent, viewport: [W, H], dpr: devicePixelRatio, probe_sha256: CFG.probe_sha256,
                  texts_sha256: CFG.texts_sha256, env_sha256: CFG.env_sha256, layout_sha256: CFG.layout_sha256, mode: MODE,
                  base_html_sha256: await sha256(html) };
    return { sig, key: (await sha256(JSON.stringify(sig))).slice(0, 12) };
  }
  /** 笔记仓库 checks/ 里同签名、有效的基准页采样（最新一份）；没有返回 null。只读。 */
  async function findBase(tok, key, sig) {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/checks`, { headers: ghHdr(tok), cache: 'no-store' });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('列 checks/ ' + r.status);
    const names = (await r.json()).map(f => f.path).filter(p => p.startsWith(`checks/devcheck_base_${key}_`)).sort();
    if (!names.length) return null;
    const path = checkPath(names[names.length - 1]);
    const g = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, { headers: ghHdr(tok, 'application/vnd.github.raw'), cache: 'no-store' });
    if (!g.ok) throw new Error('读 ' + path + ' ' + g.status);
    const d = await g.json();
    if (d.format !== 'nipc-devcheck-base' || JSON.stringify(d.sig) !== JSON.stringify(sig) || !(d.valid && d.valid.ok)) return null;
    return { path, run: d.run };
  }
  /** 上传或给下载；返回提交 sha 或 null。 */
  async function deliver(path, text, tok, msg, name, n) {
    if (!tok) { doneLine(`${name}：采好 ${n} 笔。这台设备没有存同步 token，请点下载。`); offerDownload(path, text); return null; }
    try { const sha = await upload(path, text, tok, msg); doneLine(`${name}：已上传 ${n} 笔（${String(sha).slice(0, 7)}）`); return sha; }
    catch (e) { doneLine(`${name}：采好 ${n} 笔，上传失败（${e && e.message ? e.message : e}），请点下载。`); offerDownload(path, text); return null; }
  }
  function deviceInfo() {
    return { ua: navigator.userAgent, viewport: [W, H], viewport_end: [innerWidth, innerHeight], dpr: devicePixelRatio,
             screen: [screen.width, screen.height], resizes, platform: navigator.platform || '', maxTouchPoints: navigator.maxTouchPoints || 0 };
  }
  /** 两次运行（基准 / 待测）的 iframe 排版必须同一口径：CSS 决定的量相同。 */
  function crossProblems(a, b) {
    return ['inner', 'zoom', 'p_font', 'p_lh', 'root_font'].filter(k => JSON.stringify(a.env_start[k]) !== JSON.stringify(b.env_start[k]))
      .map(k => `${a.page} 与 ${b.page} 的 ${k} 不同：${JSON.stringify(a.env_start[k])} / ${JSON.stringify(b.env_start[k])}`);
  }

  async function main() {
    const targets = targetsFromQuery();
    let lock = null;
    try { if (navigator.wakeLock) lock = await navigator.wakeLock.request('screen'); } catch (e) { /* 没有也照跑 */ }
    const at = new Date().toISOString(), stamp = at.replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
    const tok = NO_UPLOAD ? '' : token(), probeSha = await sha256(SRC.probe);
    const { sig, key } = await deviceSig();
    let base = null, basePath = null, baseCached = false;
    if (tok && !NO_CACHE) {
      say('查这台设备是否已测过基准页……');
      try { const c = await findBase(tok, key, sig); if (c) { base = c.run; basePath = c.path; baseCached = true; } }
      catch (e) { doneLine(`查基准页缓存失败（${e && e.message ? e.message : e}），重测基准页`); }
    }
    if (baseCached) doneLine(`基准页 ${CFG.base} 用这台设备上次的采样（${basePath.split('/').pop()}），这次只测待测页`);
    const pages = [...(base ? [] : [CFG.base]), ...targets];
    const t0 = performance.now();
    let doneStrokes = 0;
    const runs = [];
    for (let k = 0; k < pages.length; k++) {
      const page = pages[k], isBase = !base && k === 0;
      say(`第 ${k + 1}/${pages.length} 页 ${page}：加载中……`);
      const run = await probePage(page, !isBase, (n, N) => {
        const done = doneStrokes + n, all = N * pages.length, el = (performance.now() - t0) / 1000;
        $('#dc-bar > div').style.width = (100 * done / all).toFixed(1) + '%';
        say(`第 ${k + 1}/${pages.length} 页 ${page}：${n}/${N} 笔，预计还要 ${fmtTime(el / done * (all - done))}`);
        if (n % 50 === 0 || n === N) console.log('[devcheck] ' + $('#dc-status').textContent);
      });
      doneStrokes += run.ids.length;
      envProblems(run).forEach(warn);
      if (isBase) {   // 基准页测完先存起来：以后同一设备只测待测页
        base = run;
        const problems = [...envProblems(run)];
        if (resizes) problems.push(`设备视口变了 ${resizes} 次`);
        basePath = checkPath(`checks/devcheck_base_${key}_${stamp}.json`);
        const text = JSON.stringify({ format: 'nipc-devcheck-base', version: 1, key, sig, at, device: deviceInfo(), cfg: CFG,
                                      probe_src_sha256: probeSha, valid: { ok: !problems.length, problems }, run });
        await deliver(basePath, text, tok, `devcheck: base ${CFG.base} ${at}`, `基准页 ${CFG.base}`, run.ids.length);
      } else runs.push(run);
    }
    if (resizes) warn(`运行中设备视口变了 ${resizes} 次（旋转或缩放过），结果无效`);
    if (innerWidth !== W || innerHeight !== H) warn(`设备视口 ${W}×${H} → ${innerWidth}×${innerHeight}，结果无效`);
    const results = {};
    for (const run of runs) {
      const page = run.page, path = checkPath(`checks/devcheck_${page.replace(/\//g, '_')}_${stamp}.json`);
      const problems = [...envProblems(base), ...envProblems(run), ...crossProblems(base, run)];
      if (resizes) problems.push(`设备视口变了 ${resizes} 次`);
      problems.forEach(p => { if (!warns.includes(p)) warn(p); });
      const data = { format: 'nipc-devcheck', version: 1, page, base: CFG.base, base_ref: basePath, base_cached: baseCached, at,
                     device: deviceInfo(), sig, key, cfg: CFG, probe_src_sha256: probeSha, valid: { ok: !problems.length, problems },
                     old: base, new: run };
      results[page] = { path, data };
      say(`上传 ${page}……`);
      results[page].sha = await deliver(path, JSON.stringify(data), tok, `devcheck: ${page} ${at}`, page, run.ids.length);
    }
    const secs = Math.round((performance.now() - t0) / 1000);
    say((warns.length ? '跑完了，但上面有警告：这次结果服务器会判无效。' : '全部跑完，可以关掉这一页了。') + `（用时 ${fmtTime(secs)}）`);
    $('#dc-bar > div').style.width = '100%';
    try { if (lock) await lock.release(); } catch (e) { /* 忽略 */ }
    return results;
  }
  const done = main().catch(e => { say('出错停了：' + (e && e.message ? e.message : e)); warn('没有上传'); throw e; });
  window.__devcheck = { done, checkPath, warns, CFG };
})();
</script>
</body>
</html>
